<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capgemini Lab App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/items">
      <img src="assets/capgemini-logo.png" alt="Capgemini">
      <span id="app-name">Lab App</span>
    </a>
    <nav class="data-actions">
      <button type="button" id="btn-export">Export</button>
      <button type="button" id="btn-import">Import</button>
      <button type="button" id="btn-reset">Reset</button>
      <input type="file" id="import-file" accept=".sqlite,.db,.sqlite3" hidden>
    </nav>
  </header>

  <main id="app" class="shell">
    <p class="loading">Loading…</p>
  </main>

  <div id="toast" class="toast" hidden></div>

  <!-- Classic scripts, in this exact order. No type="module". Optional CDN libraries go just before js/app.js. -->
  <script src="vendor/sql-asm.js"></script>
  <script src="js/config.js"></script>
  <script src="js/schema.js"></script>
  <script src="js/db.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
